[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thrash-human-kernel"
version = "0.2.0"
description = "A local AI human-process scheduler for people with too many projects in memory."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.5",
  "httpx>=0.27",
  "pathspec>=0.12",
  "textual>=8.2,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
thrash = "thrash.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/thrash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
